name: Build Windows EXE

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装 PyInstaller
        run: python -m pip install --upgrade pyinstaller

      - name: 单元测试
        run: python -m unittest discover -s tests -v

      - name: 打包
        run: python -m PyInstaller --noconfirm --clean qqadscan.spec

      - name: 压缩产物
        run: Compress-Archive -Path "dist/QQ群广告扫描器/*" -DestinationPath "QQAdScan-win64.zip" -Force

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: QQAdScan-win64
          path: QQAdScan-win64.zip

      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: QQAdScan-win64.zip
          generate_release_notes: true
